name: Build Cosmic Star Lab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Descargar proyecto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar dependencias de Linux
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext \
            libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools cython==0.29.34

      - name: Configurar licencia Android
        run: |
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Preparar herramientas Android
        run: |
          buildozer android p4a -- --help

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cosmic-Star-Lab-APK
          path: bin/*.apk
          if-no-files-found: error
